[package]
name = "servyx-k8s-collector"
version = "0.1.0"
edition = "2021"
description = "Servyx Kubernetes infrastructure collector — read-only agent that collects cluster state and sends it to Servyx."
license = "MIT"
repository = "https://github.com/servyx-ai/servyx-k8s-collector"

[dependencies]
kube = { version = "0.98", features = ["runtime", "client", "derive"] }
k8s-openapi = { version = "0.24", default-features = false, features = ["v1_32"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
