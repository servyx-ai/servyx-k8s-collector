apiVersion: v1
kind: Secret
metadata:
  name: servyx-collector-config
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: servyx-k8s-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
type: Opaque
stringData:
  SERVYX_TOKEN: {{ .Values.collector.token | quote }}
  SERVYX_URL: {{ .Values.collector.servyxUrl | quote }}
  CLUSTER_ID: {{ .Values.collector.clusterId | quote }}
